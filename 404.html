<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    const knownRoutes = ['about-me', 'the-stack', 'services', 'how-i-work', 'contact', 'stats'];
    const path = window.location.pathname.replace(/\/+$/, '');
    const slug = path.split('/').pop();
    if (knownRoutes.includes(slug)) {
      const query = '?route=' + encodeURIComponent(path);
      window.location.replace('./' + query);
    } else {
      window.location.replace('./');
    }
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S25NRXRXCF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S25NRXRXCF');

    // Track Calendly intro-call clicks as a conversion event
    document.addEventListener('click', function(e) {
      var link = e.target && e.target.closest && e.target.closest('a[href*="calendly.com"]');
      if (link) {
        gtag('event', 'book_intro_call', {
          'event_category': 'engagement',
          'event_label': link.href
        });
      }
    });
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
